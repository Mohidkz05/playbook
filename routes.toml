[[route]]
name = "browser-debugging"
skill = "chrome-devtools-mcp:chrome-devtools"
plugin = "chrome-devtools-mcp@claude-plugins-official"
reason = "Inspect a running page: console, network, performance, screenshots"
words = ["console error", "network request", "lighthouse", "page is slow", "in the browser", "screenshot"]
