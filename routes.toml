[[route]]
name = "deploy"
skill = "vercel:deployments-cicd"
plugin = "vercel@claude-plugins-official"
reason = "Deploying, previews, promotions, rollbacks, CI/CD"
words = ["deploy", "deployment", "vercel", "preview url", "rollback"]
